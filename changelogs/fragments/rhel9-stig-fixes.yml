bugfixes:
  - roles/rhel9stig_supp/tasks/rules.yml - split the combined AIDE hashing/ACL/
    extended-attribute enforcement (V-258136/V-258138/V-258139) into three
    independently tracked tasks; the previous single task only ever reported
    a compliance result for V-258136, and its changed_when condition was
    always true, so it never reliably reported success or failure for any of
    the three rules.
  - roles/rhel9stig_supp/tasks/rules.yml - fixed V-258236's crypto-policy
    override detection, which checked for the substring "match" in
    `update-crypto-policies --check` output; both the compliant and
    noncompliant messages contain that substring, so the remediation could
    never actually trigger. Also corrected a reference to a nonexistent
    variable (rhel9stig_stigrule_258241_crypto_policy) in the same task.
  - roles/rhel9stig_supp/tasks/rules.yml - extended V-258165's audit log
    group-ownership remediation to also correct existing audit log files, not
    just the parent directory, matching what the STIG check actually
    inspects.
  - roles/rhel9stig_supp/templates/dconf/01-banner-message.j2 - added the
    dconf template that V-270174 required but that did not exist, and
    corrected rhel9stig_stigrule_dod_banner_text in defaults/main.yml, whose
    wording did not exactly match the DOD-mandated banner text required by
    the STIG's exact-match check.
