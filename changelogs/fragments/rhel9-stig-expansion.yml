major_changes:
  - roles/rhel9stig_supp/tasks/rules.yml - added filesystem mount option hardening
    (RHEL-09-231045 through RHEL-09-231200) - nodev/noexec/nosuid enforcement and
    special-device restrictions on /boot, /boot/efi, /dev/shm, /tmp, /var,
    /var/log, /var/log/audit, /var/tmp, NFS-imported filesystems, removable
    media, and user home directories (V-257850-257878, V-257881).
  - roles/rhel9stig_supp/tasks/rules.yml - added file and directory ownership
    and permission hardening (RHEL-09-232010 through RHEL-09-232260) - system
    commands, library directories/files, audit tools, cron configuration,
    world-writable directories, the sticky bit on public directories, valid
    owner/group enforcement, and SELinux device file labeling
    (V-257882-257932).
  - roles/rhel9stig_supp/tasks/rules.yml - added network hardening
    (RHEL-09-251020/251040) - a deny-all/allow-by-exception firewall policy
    and disabling promiscuous mode on network interfaces (V-257937, V-257941).
  - roles/rhel9stig_supp/tasks/rules.yml - added system services hardening
    (RHEL-09-252020 through RHEL-09-252075) - time synchronization comparison,
    a minimum DNS resolver count, blocking unauthorized IP tunnels,
    restricting mail relaying, forwarding postmaster mail via a postfix
    alias, and removing shosts.equiv/.shosts files (V-257945, V-257948,
    V-257950, V-257951, V-257953, V-257955, V-257956).
  - roles/rhel9stig_supp/tasks/rules.yml - added SSH hardening (RHEL-09-255064
    through RHEL-09-255125) - DOD-approved cipher and MAC enforcement for both
    the SSH client and server via the systemwide crypto-policies backend
    files, plus SSH configuration and host key file permissions (V-257989,
    V-257991, V-257999, V-258000, V-258001, V-270177, V-270178).
  - roles/rhel9stig_supp/tasks/rules.yml - added GUI/session hardening
    (RHEL-09-271040 through RHEL-09-271095) - disabling unattended/automatic
    graphical logon, verifying the effective dconf policy matches its
    keyfiles, and disabling system restart from the login screen (V-258018,
    V-258028, V-258029).
  - roles/rhel9stig_supp/tasks/rules.yml - added peripheral control
    (RHEL-09-291030) - blocking unauthorized peripherals via USBGuard before
    they can connect (V-258038).
  - roles/rhel9stig_supp/tasks/rules.yml - added interactive user account
    hardening (RHEL-09-411015 through RHEL-09-412080) - password lifetime
    limits, a umask of 077, unique UIDs/GIDs, disabling interactive shells
    for system accounts, valid primary groups, safe executable search paths
    in initialization files, home directory assignment/existence/ownership,
    restricting UID 0 to root, and terminating idle sessions (V-258042,
    V-258044, V-258045, V-258046, V-258048, V-258050, V-258051, V-258052,
    V-258053, V-258059, V-258061, V-258068, V-258077).
  - roles/rhel9stig_supp/tasks/rules.yml - added SELinux and privilege
    escalation hardening (RHEL-09-431016 through RHEL-09-432035) - a
    nondefault SELinux faillock tally directory context, sudo requiring the
    invoking user's own password and reauthentication, restricting who can
    elevate privileges and use "su", and elevating the SELinux context
    (TYPE=sysadm_t ROLE=sysadm_r) when an administrator invokes sudo -
    including the semanage login mapping and ssh_sysadm_login boolean needed
    to keep that elevation from breaking sudo/SSH access for the designated
    admin group (V-258080, V-258085, V-258086, V-258087, V-258088, V-272496).
  - roles/rhel9stig_supp/tasks/rules.yml - added the fapolicyd deny-all,
    permit-by-exception policy (RHEL-09-433016) (V-270180).
  - roles/rhel9stig_supp/tasks/rules.yml - added PAM and authentication
    hardening (RHEL-09-611010 through RHEL-09-611200) - password complexity
    and pam_faillock in both system-auth and password-auth, sufficient
    pam_unix hashing rounds, a 24-hour minimum password lifetime, requiring a
    password for privilege escalation with no bypass, disallowing blank/null
    passwords, OCSP certificate status checking for multifactor
    authentication, and requiring authentication for single-user mode
    (V-258091, V-258094-258100, V-258105, V-258106, V-258118, V-258120,
    V-258123, V-258129).
  - roles/rhel9stig_supp/tasks/rules.yml - added PKI certification path
    validation for SSSD authentication against the DOD root CA bundle
    (RHEL-09-631010) (V-258131).
  - roles/rhel9stig_supp/tasks/rules.yml - added AIDE file integrity
    monitoring (RHEL-09-651010 through RHEL-09-651035) - installs AIDE,
    schedules a periodic integrity check, enforces FIPS-approved (sha512),
    ACL, and extended-attribute hashing on every AIDE rule definition, and
    protects the audit tool binaries themselves (V-258134-258139).
  - roles/rhel9stig_supp/tasks/rules.yml - added audit log handling
    (RHEL-09-652025 through RHEL-09-653125) - rejecting remote rsyslog log
    reception, forwarding audit records via TCP, sizing audit storage for at
    least one week of records, restricting audit configuration file access,
    sizing the audit backlog limit, and a mail alias to notify the ISSO/SA on
    audit failure (V-258143, V-258149, V-258155, V-258171, V-258173,
    V-258174).
  - roles/rhel9stig_supp/tasks/rules.yml - added audit log file protection
    (RHEL-09-653080 through RHEL-09-653090, RHEL-09-232103/232104) - group,
    owner, and mode enforcement on the audit log directory and files, and on
    /etc/audit itself (V-258165, V-258166, V-258167, V-270175, V-270176).
  - roles/rhel9stig_supp/tasks/rules.yml - added audit rules for the
    umount/umount2 syscalls (RHEL-09-654205/654210) (V-258215, V-258216).
  - roles/rhel9stig_supp/tasks/rules.yml - added FIPS mode and systemwide
    cryptographic policy hardening (RHEL-09-215105, RHEL-09-671010 through
    RHEL-09-672050) - enables FIPS mode, locks accounts with non-FIPS-approved
    password hashes, requires FIPS-approved crypto for IP tunnels and
    pam_unix hashing, detects and corrects an overridden systemwide crypto
    policy, and applies the FIPS:STIG crypto policy (including the SSH
    cipher/MAC subpolicy) plus DOD-approved encryption for BIND (V-258230,
    V-258231, V-258232, V-258233, V-258236, V-258241, V-258242).
  - roles/rhel9stig_supp/tasks/rules.yml, roles/rhel9stig_supp/templates/dconf/01-banner-message.j2
    - added the Standard Mandatory DOD Notice and Consent Banner on graphical
    logon (RHEL-09-171011) (V-270174).
