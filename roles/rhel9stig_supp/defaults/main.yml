# Global vars
rhel9stig_allow_system_reboot: true
# Every sysctl.d precedence directory the STIG checks grep for conflicting keys.
rhel9stig_stigrule_sysctl_dirs:
  - /run/sysctl.d
  - /usr/local/lib/sysctl.d
  - /usr/lib/sysctl.d
  - /lib/sysctl.d
  - /etc/sysctl.d
rhel9stig_stigrule_sysctl_file: /etc/sysctl.d/99-sysctl.conf
# Local filesystem types walked by the whole system find based rules.
rhel9stig_stigrule_local_fstypes:
  - ext2
  - ext3
  - ext4
  - xfs
  - btrfs
  - vfat
rhel9stig_stigrule_audit_rules_file: /etc/audit/rules.d/stig.rules
rhel9stig_stigrule_audit_tool_bins:
  - /usr/sbin/auditctl
  - /usr/sbin/auditd
  - /usr/sbin/ausearch
  - /usr/sbin/aureport
  - /usr/sbin/autrace
  - /usr/sbin/rsyslogd
  - /usr/sbin/augenrules
rhel9stig_stigrule_authselect_features:
  - with-faillock
  - with-files-access-provider
  - with-files-domain
  - with-mkhomedir
  - with-smartcard
  - with-smartcard-lock-on-removal
  - with-sudo
  - without-nullok
rhel9stig_stigrule_authselect_force: true
rhel9stig_stigrule_authselect_profile: sssd
rhel9stig_stigrule_authselect_dir: /var/log/faillock
rhel9stig_stigrule_crypto_policy: 'FIPS:STIG'
rhel9stig_stigrule_logon_DenyAttempts: 3
rhel9stig_stigrule_login_FailInterval: 900
rhel9stig_stigrule_login_UnlockTime: 0
rhel9stig_stigrule_pam_unix_rounds: 100000
rhel9stig_stigrule_sssd_domain: fully.qualified.domain.name
rhel9stig_stigrule_sssd_id_provider: files
rhel9stig_stigrule_dod_banner_text: >-
  You are accessing a U.S. Government (USG) Information System (IS) that is
  provided for USG-authorized use only.\nBy using this IS (which includes any
  device attached to this IS), you consent to the following conditions:\n-The USG
  routinely intercepts and monitors communications on this IS for purposes
  including, but not limited to, penetration testing, COMSEC monitoring, network
  operations and defense, personnel misconduct (PM), law enforcement (LE), and
  counterintelligence (CI) investigations.\n-At any time, the USG may inspect and
  seize data stored on this IS.\n-Communications using, or data stored on, this
  IS are not private, are subject to routine monitoring, interception, and search,
  and may be disclosed or used for any USG-authorized purpose.\n-This IS includes
  security measures (e.g., authentication and access controls) to protect USG
  interests--not for your personal benefit or privacy.\n-Notwithstanding the
  above, using this IS does not constitute consent to PM, LE or CI investigative
  searching or monitoring of the content of privileged communications, or work
  product, related to personal representation or services by attorneys,
  psychotherapists, or clergy, and their assistants. Such communications and work
  product are private and confidential. See User Agreement for details.
