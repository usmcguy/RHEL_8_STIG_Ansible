  when: rhel9stig_stigrule_257937_Manage

- name: Get current default zone
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: firewalld_default_zone
  changed_when: false
  when:
    - rhel9stig_stigrule_257937_Manage

- name: Get active firewall zones
  ansible.posix.firewalld_info:
    active_zones: true
  register: active_zones
  when:
    - rhel9stig_stigrule_257937_Manage

- name: Define default firewall zone
