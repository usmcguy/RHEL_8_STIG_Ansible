    regexp: '^(?!\s*#)(?!\s*({{ exempt_sudoers }})\b)(.*)\s*NOPASSWD:'
    replace: '\2'
  loop: "{{ sudoers_nopasswd.stdout_lines | default([]) }}"
  when:
    - rhel9stig_stigrule_258106_Manage
    - sudoers_nopasswd.stdout_lines | default([]) | length > 0

