# R-257932 RHEL-09-232260
- name: Get SELinux status
  ansible.builtin.command: getenforce
  register: selinux_state
  changed_when: false
  failed_when: false
  when: rhel9stig_stigrule_257932_Manage

- name: Find incorrectly labeled device files
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      find /dev \
        \( -context '*:device_t:*' -o -context '*:unlabeled_t:*' \) \
        \( -type c -o -type b \) -printf '%p\n' 2>/dev/null || true
  register: mislabeled_devices
  changed_when: false
  when:
    - rhel9stig_stigrule_257932_Manage
    - selinux_state.stdout | default('Disabled') != 'Disabled'

- name: stigrule_257932__restorecon_mislabeled_devices
  ansible.builtin.command: "restorecon -v {{ item }}"
  loop: "{{ mislabeled_devices.stdout_lines | default([]) | difference(rhel9stig_stigrule_257932_ignore_devices) }}"
  register: restorecon_devices
  changed_when: "'Relabeled' in restorecon_devices.stdout"
  when:
    - rhel9stig_stigrule_257932_Manage
    - mislabeled_devices.stdout_lines | default([]) | length > 0

- name: Recheck device labels after restorecon
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      find {{ rhel9stig_stigrule_257932_device_paths | join(' ') }} \
        \( -context '*:device_t:*' -o -context '*:unlabeled_t:*' \) \
        \( -type c -o -type b \) -printf '%p\n' 2>/dev/null || true
  register: mislabeled_devices_recheck
  changed_when: false
  when:
    - rhel9stig_stigrule_257932_Manage
    - restorecon_devices is changed

- name: stigrule_257932__report_devices_still_mislabeled
  ansible.builtin.debug:
    msg: >-
      Device files remain labeled device_t or unlabeled_t and require a more specific
      SELinux policy or a reinstall of the package providing the device class:
      {{ mislabeled_devices_recheck.stdout_lines | difference(rhel9stig_stigrule_257932_ignore_devices) | join(', ') }}
  when:
    - rhel9stig_stigrule_257932_Manage
    - mislabeled_devices_recheck.stdout_lines | default([]) | difference(rhel9stig_stigrule_257932_ignore_devices) | length > 0

# R-257937 RHEL-09-251020
- name: stigrule_257937__ensure_firewalld_present
  ansible.builtin.dnf:
    name: firewalld
    state: present
  when: rhel9stig_stigrule_257937_Manage

- name: stigrule_257937__ensure_python-firewall_present
  ansible.builtin.dnf:
    name: python3-firewall
    state: present
  when: rhel9stig_stigrule_257937_Manage

- name: stigrule_257937__ensure_firewalld_running
  ansible.builtin.service:
    name: firewalld
    state: started
  when: rhel9stig_stigrule_257937_Manage

- name: Get current default zone
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: firewalld_default_zone
  changed_when: false
  when:
    - rhel9stig_stigrule_257937_Manage

- name: Get active firewall zones
  ansible.posix.firewalld_info:
    active_zones: true
  register: active_zones
  when:
    - rhel9stig_stigrule_257937_Manage

- name: Define default firewall zone
  ansible.builtin.set_fact:
    firewalld_default_zone: "{{ active_zones.firewalld_info.default_zone }}"
  when:
    - rhel9stig_stigrule_257937_Manage

- name: Get detailed default zone info
  ansible.posix.firewalld_info:
    zones: "{{ default_zone }}"
  register: zone_details
  when:
    - rhel9stig_stigrule_257937_Manage

- name: Get built-in zone names
  ansible.bulitin.shell:
    cmd: |
      find /usr/lib/firewalld/zones -maxdepth 1 -type f -name '*.xml' -printf '%f\n' | sed 's/\.xml$/'
  register: builtin_zones
  when:
    - rhel9stig_stigrule_257937_Manage

- name: stigrule_257937__create_firewall_zone
  ansible.posix.firewalld:
    zone: "{{ rhel9stig_stigrule_257937_zone }}"
    state: present
    permanent: true
  register: create_firewall_zone
  when:
    - rhel9stig_stigrule_257937_Manage
    - rhel9stig_stigrule_257937_zone not in builtin_zones

- name: stigrule_257937__set_zone_shortname
  ansible.builtin.lineinfile:
    path: /etc/firewalld/zones/{{ rhel9stig_stigrule_257937_zone }}.xml
    regexp: '^(\s*)<short>.*</short>'
    line: "  <short>{{ rhel9stig_stigrule_257937_zone }}</short>"
    insertafter: '<zone'
    state: present
  register: firewall_zone_shortname
  when:
    - rhel9stig_stigrule_257937_Manage
    - rhel9stig_stigrule_257937_zone not in builtin_zones

- name: stigrule_257937__set_zone_description
  ansible.builtin.lineinfile:
    path: /etc/firewalld/zones/{{ rhel9stig_stigrule_257937_zone }}.xml
    regexp: '^(\s*)<description>.*</description>'
    line: "  <description>{{ rhel9stig_stigrule_257937_zoneDesc }}</description>"
    insertafter: '<short>'
    state: present
  register: firewall_zone_desc
  when:
    - rhel9stig_stigrule_257937_Manage
    - rhel9stig_stigrule_257937_zone not in builtin_zones

- name: Reload firewall rules
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: false
  when:
    - rhel9stig_stigrule_257937_Manage
    - firewall_zone_shortname.changed or firewall_zone_desc.changed

- name: stigrule_257937__set_zone_drop_target
  ansible.posix.firewalld:
    zone: "{{ rhel9stig_stigrule_257937_zone }}"
    state: present
    permanent: true
    target: DROP
  when:
    - rhel9stig_stigrule_257937_Manage

- name: stigrule_257937__set_allowed_services
  ansible.posix.firewalld:
    zone: "{{ rhel9stig_stigrule_257937_zone }}"
    service: "{{ item }}"
    state: enabled
    permanent: true
  loop: "{{ rhel9stig_stigrule_257937_allowed_services }}"
  when:
    - rhel9stig_stigrule_257937_Manage

- name: stigrule_257937__set_allowed_ports
  ansible.posix.firewalld:
    zone: "{{ rhel9stig_stigrule_257937_zone }}"
    port: "{{ item }}"
    state: enabled
    permanent: true
  loop: "{{ rhel9stig_stigrule_257937_allowed_ports }}"
  when:
    - rhel9stig_stigrule_257937_Manage

- name: stigrule_257937__assign_interfaces_to_firewall_zone
  ansible.posix.firewalld:
    zone: "{{ rhel9stig_stigrule_257937_zone }}"
    interface: "{{ item }}"
    state: enabled
    permanent: true
  loop: "{{ ansible_interfaces | difference(['lo']) }}"
  when:
    - rhel9stig_stigrule_257937_Manage

- name: Reload firewall rules
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: false
  when:
    - rhel9stig_stigrule_257937_Manage
    - create_firewall_zone.changed

- name: stigrule_257937__set_firewall_zone_as_default
  ansible.builtin.command: firewall-cmd --set-default-zone={{ rhel9stig_stigrule_257937_zone }}
  register: set_default_zone
  changed_when: '"ZONE_ALREADY_SET" not in set_default_zone.stderr'
  when:
    - rhel9stig_stigrule_257937_Manage
    - firewalld_default_zone != rhel9stig_stigrule_257937_zone
