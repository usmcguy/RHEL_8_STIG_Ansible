    - selinux_state.stdout | default('Disabled') != 'Disabled'

- name: stigrule_257932__restorecon_mislabeled_devices
  ansible.builtin.command: "restorecon -v {{ item }}"
  loop: "{{ mislabeled_devices.stdout_lines | default([]) | difference(rhel9stig_stigrule_257932_ignore_devices) }}"
  register: restorecon_devices
  changed_when: "'Relabeled' in restorecon_devices.stdout"
  when:
    - rhel9stig_stigrule_257932_Manage
    - mislabeled_devices.stdout_lines | default([]) | length > 0

- name: Recheck device labels after restorecon
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      find {{ rhel9stig_stigrule_257932_device_paths | join(' ') }} \
        \( -context '*:device_t:*' -o -context '*:unlabeled_t:*' \) \
        \( -type c -o -type b \) -printf '%p\n' 2>/dev/null || true
  register: mislabeled_devices_recheck
  changed_when: false
  when:
    - rhel9stig_stigrule_257932_Manage
    - restorecon_devices is changed

- name: stigrule_257932__report_devices_still_mislabeled
  ansible.builtin.debug:
    msg: >-
      Device files remain labeled device_t or unlabeled_t and require a more specific
      SELinux policy or a reinstall of the package providing the device class:
      {{ mislabeled_devices_recheck.stdout_lines | difference(rhel9stig_stigrule_257932_ignore_devices) | join(', ') }}
  when:
    - rhel9stig_stigrule_257932_Manage
    - mislabeled_devices_recheck.stdout_lines | default([]) | difference(rhel9stig_stigrule_257932_ignore_devices) | length > 0

