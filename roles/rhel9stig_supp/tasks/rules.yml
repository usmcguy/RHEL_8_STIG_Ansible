# R-257948 RHEL-09-252035
- name: Get configured NetworkManager DNS mode
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      awk -F= '/^\s*dns\s*=/ {gsub(/[[:space:]]/, "", $2); print $2}' \
        /etc/NetworkManager/NetworkManager.conf 2>/dev/null || true
  register: nm_dns_mode
  changed_when: false
  when:
    - rhel9stig_stigrule_257948_Manage
    - not rhel9stig_stigrule_257948_not_applicable

- name: Count current name servers
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep -c '^\s*nameserver\s' /etc/resolv.conf || true
  register: resolv_nameserver_count
  changed_when: false
  when:
    - rhel9stig_stigrule_257948_Manage
    - not rhel9stig_stigrule_257948_not_applicable

# With dns=none NetworkManager leaves /etc/resolv.conf alone, so it is managed
# directly. Any other mode means NetworkManager owns the file and edits there
# would be overwritten, so the connection profile is updated instead.
- name: stigrule_257948__add_nameservers_to_resolv_conf
  ansible.builtin.lineinfile:
    path: /etc/resolv.conf
    line: "nameserver {{ item }}"
    regexp: '^\s*nameserver\s+{{ item | regex_escape }}\s*$'
    owner: root
    group: root
    mode: '0644'
    create: true
  loop: "{{ rhel9stig_stigrule_257948_nameservers }}"
  when:
    - rhel9stig_stigrule_257948_Manage
    - not rhel9stig_stigrule_257948_not_applicable
    - nm_dns_mode.stdout | default('') == 'none'
    - resolv_nameserver_count.stdout | default('0') | int < 2
    - rhel9stig_stigrule_257948_nameservers | length >= 2

- name: Get active NetworkManager connection
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      nmcli -t -f NAME connection show --active | head -1 || true
  register: nm_active_connection
  changed_when: false
  when:
    - rhel9stig_stigrule_257948_Manage
    - not rhel9stig_stigrule_257948_not_applicable
    - nm_dns_mode.stdout | default('') != 'none'
    - resolv_nameserver_count.stdout | default('0') | int < 2

- name: stigrule_257948__set_nameservers_on_nm_connection
  ansible.builtin.command: >-
    nmcli connection modify
    '{{ rhel9stig_stigrule_257948_connection | default(nm_active_connection.stdout, true) }}'
    {{ rhel9stig_stigrule_257948_ip_family }}.dns
    '{{ rhel9stig_stigrule_257948_nameservers | join(",") }}'
  register: nm_dns_set
  changed_when: nm_dns_set.rc == 0
  notify: NetworkManager_restart
  when:
    - rhel9stig_stigrule_257948_Manage
    - not rhel9stig_stigrule_257948_not_applicable
    - nm_dns_mode.stdout | default('') != 'none'
    - resolv_nameserver_count.stdout | default('0') | int < 2
    - rhel9stig_stigrule_257948_nameservers | length >= 2
    - (rhel9stig_stigrule_257948_connection | default(nm_active_connection.stdout, true)) | length > 0

- name: stigrule_257948__report_insufficient_nameservers
  ansible.builtin.debug:
    msg: >-
      Fewer than two name servers are configured and
      rhel9stig_stigrule_257948_nameservers does not supply at least two.
      RHEL-09-252035 cannot be remediated without site specific resolvers.
  when:
    - rhel9stig_stigrule_257948_Manage
    - not rhel9stig_stigrule_257948_not_applicable
    - resolv_nameserver_count.stdout | default('0') | int < 2
    - rhel9stig_stigrule_257948_nameservers | length < 2

