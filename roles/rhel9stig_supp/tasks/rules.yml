    find -L {{ rhel9stig_stigrule_257882_bin_paths | join(' ') }} {{ exclude_chmod_binary_cmd }} -type f \( -perm /g+w -o -perm /o+w \) -exec ls -al {} + -exec chmod go-w {} + || true
  register: chmod_binary_cmds
  changed_when: chmod_binary_cmds.stdout | length > 0
  when: rhel9stig_stigrule_257882_Manage

