# R-258129 RHEL-09-611200
- name: Check rescue.service for sulogin
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep -sv '^[[:space:]]*[#;]' /usr/lib/systemd/system/rescue.service | grep -sE '^(\s*)(ExecStart=.*sulogin.*)$' || true
  register: rescue_sulogin
  changed_when: false
  when: rhel9stig_stigrule_258129_Manage

- name: Check rescue.service.d drop-in files for sulogin
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for f in /etc/systemd/system/rescue.service.d/*.conf; do
        [ -f "$f" ] || continue
        grep -v '^[[:space:]]*[#;]' "$f" | grep -q sulogin && echo "$f"
      done
      true
  register: rescue_sulogin_dropin
  changed_when: false
  when: rhel9stig_stigrule_258129_Manage

- name: stigrule_258129__comment_out_vendor_rescue_execstart
  ansible.builtin.replace:
    path: /usr/lib/systemd/system/rescue.service
    regexp: '^(\s*)(ExecStart=.*sulogin.*)$'
    replace: '\1# \2'
  notify: daemon_reload
  when:
    - rhel9stig_stigrule_258129_Manage
    - rescue_sulogin.stdout | length > 0

- name: stigrule_258129__remove_foreign_rescue_service_dropins
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ rescue_sulogin_dropin.stdout_lines }}"
  notify: daemon_reload
  when:
    - rhel9stig_stigrule_258129_Manage
    - rescue_sulogin_dropin.stdout | length > 0
    - item != '/etc/systemd/system/rescue.service.d/rescue.service.conf'

- name: stigrule_258129__create_rescue_service_override_directory
  ansible.builtin.file:
    path: /etc/systemd/system/rescue.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - rhel9stig_stigrule_258129_Manage
    - rescue_sulogin.stdout | length == 0 or rescue_sulogin_dropin.stdout | length > 0

- name: stigrule_258129__require_authentication_for_single_user_mode
  community.general.ini_file:
    path: /etc/systemd/system/rescue.service.d/rescue.service.conf
    section: Service
    option: ExecStart
    value: -/usr/lib/systemd/systemd-sulogin-shell rescue
    mode: '0644'
    owner: root
    group: root
    ignore_spaces: false
    no_extra_spaces: true
  notify: daemon_reload
  when:
    - rhel9stig_stigrule_258129_Manage

# R-258131 RHEL-09-631010
# https://dl.dod.cyber.mil/wp-content/uploads/pki-pke/zip/unclass-certificates_pkcs7_DoD.zip
- name: stigrule_258131__define_vars
  ansible.builtin.set_fact:
    dod_work_dir: /tmp/dod_certs
    sssd_ca_db: /etc/sssd/pki/sssd_auth_ca_db.pem
  when: rhel9stig_stigrule_258131_Manage

- name: stigrule_258131_cleanup__sssd_ca_db_stat
  ansible.builtin.stat:
    path: "{{ sssd_ca_db }}"
    get_checksum: false
    get_mime: false
  register: cleanup_ca_db_stat
  when:
    - rhel9stig_stigrule_258131_Manage
    - rhel9stig_stigrule_258131_remove_non_dod or rhel9stig_stigrule_258131_remove_expired

- name: stigrule_258131__cleanup_block
  when:
    - rhel9stig_stigrule_258131_Manage
    - rhel9stig_stigrule_258131_remove_non_dod or rhel9stig_stigrule_258131_remove_expired
    - cleanup_ca_db_stat.stat.exists
  block:
    - name: stigrule_258131_cleanup__read_sssd_ca_db
      ansible.builtin.slurp:
        path: "{{ sssd_ca_db }}"
      register: cleanup_db_raw
      become: true
      no_log: true

    - name: stigrule_258131_cleanup__split_sssd_ca_bundle
      ansible.builtin.set_fact:
        cleanup_db_pems: >-
          {{ (cleanup_db_raw.content | b64decode)
            | regex_findall('-----BEGIN CERTIFICATE-----(?:.|\n)+?-----END CERTIFICATE-----',
            multiline=True) }}
      no_log: true

    - name: stigrule_258131_cleanup__read_cert_info
      community.crypto.x509_certificate_info:
        content: "{{ item }}"
      loop: "{{ cleanup_db_pems }}"
      register: cleanup_ca_infos
      no_log: true
      delegate_to: localhost

    - name: stigrule_258131_cleanup__initialize_lists
      ansible.builtin.set_fact:
        cleanup_keep_pems: []
        cleanup_removed_certs: []

    - name: stigrule_258131_cleanup__id_kept_cas
      ansible.builtin.set_fact:
        cleanup_keep_pems: >-
          {{ cleanup_keep_pems
            + [ { 'name': item.subject.commonName, 'pem': item.item,
            'subject_line':
              'subject=C = ' ~ (item.subject.countryName | default('US'))
              ~ ', O = ' ~ (item.subject.organizationName | default('U.S. Government'))
              ~ ', OU = ' ~ (item.subject_ordered.organizationalUnitName[0] | default('DoD'))
              ~ ', OU = ' ~ (item.subject_ordered.organizationalUnitName[1] | default('PKI'))
              ~ ', CN = ' ~ item.subject.commonName,
            'issuer_line':
              'issuer=C = ' ~ (item.issuer.countryName | default('US'))
              ~ ', O = ' ~ (item.issuer.organizationName | default('U.S. Government'))
              ~ ', OU = ' ~ (item.issuer_ordered.organizationalUnitName[0] | default('DoD'))
              ~ ', OU = ' ~ (item.issuer_ordered.organizationalUnitName[1] | default('PKI'))
              ~ ', CN = ' ~ item.issuer.commonName,
            } ] }}
      loop: "{{ cleanup_ca_infos.results }}"
      loop_control:
        label: "{{ item.subject.commonName | default('unknown') }}"
      no_log: true
      when:
        - >
          (not rhel9stig_stigrule_258131_remove_non_dod or
            (
              (item.issuer.organizationName | default('') == 'U.S. Government')
              and
              (
                item.issuer_ordered.organizationalUnitName | default([])
                | select('search', 'DoD')
                | list
                | length > 0
              )
            )
          )
        - "not rhel9stig_stigrule_258131_remove_expired or not (item.expired | default(true))"

    - name: stigrule_258131_cleanup__id_removed_cas
      ansible.builtin.set_fact:
        cleanup_removed_certs: >-
          {{ cleanup_removed_certs
            + [ { 'name': item.subject.commonName | default('unknown'),
            'subject_line':
              'subject=C = ' ~ (item.subject.countryName | default('US'))
              ~ ', O = ' ~ (item.subject.organizationName | default('U.S. Government'))
              ~ ', OU = ' ~ (item.subject_ordered.organizationalUnitName[0] | default('DoD'))
              ~ ', OU = ' ~ (item.subject_ordered.organizationalUnitName[1] | default('PKI'))
              ~ ', CN = ' ~ (item.subject.commonName | default('unknown')),
            'issuer_line':
              'issuer=C = ' ~ (item.issuer.countryName | default('US'))
              ~ ', O = ' ~ (item.issuer.organizationName | default('U.S. Government'))
              ~ ', OU = ' ~ (item.issuer_ordered.organizationalUnitName[0] | default('DoD'))
              ~ ', OU = ' ~ (item.issuer_ordered.organizationalUnitName[1] | default('PKI'))
              ~ ', CN = ' ~ (item.issuer.commonName | default('unknown')),
            'not_dod_issued': not (
                (item.issuer.organizationName | default('') == 'U.S. Government')
                and
                (
                  item.issuer_ordered.organizationalUnitName | default([])
                  | select('search', 'DoD')
                  | list
                  | length > 0
                )
              ),
            'expired': item.expired | default(true)
            } ] }}
      loop: "{{ cleanup_ca_infos.results }}"
      loop_control:
        label: "{{ item.subject.commonName | default('unknown') }}"
      no_log: true
      when: >
        (rhel9stig_stigrule_258131_remove_non_dod and not (
          (item.issuer.organizationName | default('') == 'U.S. Government')
          and
          (
            item.issuer_ordered.organizationalUnitName | default([])
            | select('search', 'DoD')
            | list
            | length > 0
          )
        ))
        or
        (rhel9stig_stigrule_258131_remove_expired and (item.expired | default(true)))

    - name: stigrule_258131_cleanup__report_removed_certs
      ansible.builtin.debug:
        msg: >-
          The following certificates in {{ sssd_ca_db }} are candidates for
          removal: {{ cleanup_removed_certs }}
      when: cleanup_removed_certs | length > 0

    - name: stigrule_258131_cleanup__write_cleaned_bundle
      ansible.builtin.copy:
        dest: "{{ sssd_ca_db }}"
        content: >-
          {{ (cleanup_keep_pems | map(attribute='pem') | join('\n\n'))
            ~ ("\n" if cleanup_keep_pems | length > 0 else "") }}
        mode: "0640"
        owner: root
        group: sssd
        backup: true
      become: true
      when:
        - not rhel9stig_stigrule_258131_cleanup_report_only
        - cleanup_removed_certs | length > 0

- name: stigrule_258131__create_working_dir
  ansible.builtin.file:
    path: "{{ dod_work_dir }}"
    state: directory
    mode: '0755'
  when: rhel9stig_stigrule_258131_Manage

- name: stigrule_258131__unarchive_DoD_certs
  ansible.builtin.unarchive:
    src: "{{ rhel9stig_stigrule_258131_ca_bundle_path }}"
    dest: "{{ dod_work_dir }}"
  when: rhel9stig_stigrule_258131_Manage

- name: stigrule_258131__find_pem_p7b
  ansible.builtin.find:
    path: "{{ dod_work_dir }}"
    recurse: true
    patterns: '(?i).*pem.p7b'
    use_regex: true
    file_type: file
  register: dod_pem_p7b
  when: rhel9stig_stigrule_258131_Manage

- name: stigrule_258131__define_dod_p7b_path
  ansible.builtin.set_fact:
    dod_p7b_path: "{{ (dod_pem_p7b.files | first).path }}"
  when: rhel9stig_stigrule_258131_Manage

- name: stigrule_258131__convert_p7b_to_pem
  ansible.builtin.command:
    cmd: "openssl pkcs7 -print_certs -in {{ dod_p7b_path }} -out {{ dod_work_dir }}/dod_bundle.pem"
    creates: "{{ dod_work_dir }}/dod_bundle.pem"
  register: pkcs7_convert
  changed_when: pkcs7_convert.rc == 0 and ('skipped' not in pkcs7_convert.stdout)
  when: rhel9stig_stigrule_258131_Manage

- name: stigrule_258131__read_dod_bundle_pem
  ansible.builtin.slurp:
    path: "{{ dod_work_dir }}/dod_bundle.pem"
  register: dod_bundle_raw
  when: rhel9stig_stigrule_258131_Manage
  no_log: true

- name: stigrule_258131__split_dod_bundle_pem
  ansible.builtin.set_fact:
    dod_bundle_pems: >-
      {{ (dod_bundle_raw.content | b64decode)
          | regex_findall('-----BEGIN CERTIFICATE-----(?:.|\n)+?-----END CERTIFICATE-----',
                          multiline=True) }}
  when: rhel9stig_stigrule_258131_Manage
  no_log: true

- name: stigrule_258131__read_cert_info
  community.crypto.x509_certificate_info:
    content: "{{ item }}"
  loop: "{{ dod_bundle_pems }}"
  register: dod_ca_infos
  no_log: true
  when: rhel9stig_stigrule_258131_Manage
  delegate_to: localhost

- name: stigrule_258131__sssd_ca_db_stat
  ansible.builtin.stat:
    path: "{{ sssd_ca_db }}"
    get_checksum: false
    get_mime: false
  register: sssd_ca_db_stat
  when: rhel9stig_stigrule_258131_Manage

- name: stigrule_258131__create_empty_sssd_ca_db
  ansible.builtin.copy:
    content: ''
    dest: "{{ sssd_ca_db }}"
    mode: '0640'
    owner: root
    group: sssd
  when:
    - rhel9stig_stigrule_258131_Manage
    - not sssd_ca_db_stat.stat.exists

- name: stigrule_258131__read_sssd_ca_db
  ansible.builtin.slurp:
    path: "{{ sssd_ca_db }}"
  register: sssd_db_raw
  become: true
  no_log: true
  when:
    - rhel9stig_stigrule_258131_Manage
    # - sssd_ca_db_stat.stat.exists

- name: stigrule_258131__split_sssd_ca_bundle
  ansible.builtin.set_fact:
    sssd_db_pems: >-
      {{ (sssd_db_raw.content | b64decode)
        | regex_findall('-----BEGIN CERTIFICATE-----(?:.|\n)+?-----END CERTIFICATE-----',
        multiline=True) }}
  no_log: true
  when:
    - rhel9stig_stigrule_258131_Manage
    # - sssd_ca_db_stat.stat.exists

- name: stigrule_258131__create_empty_db_pems
  ansible.builtin.set_fact:
    sssd_db_pems: []
  when:
    - rhel9stig_stigrule_258131_Manage
    - not sssd_ca_db_stat.stat.exists


- name: stigrule_258131__initialize_missing_root_cas
  ansible.builtin.set_fact:
    missing_root_cas: []
  when: rhel9stig_stigrule_258131_Manage

- name: stigrule_258131__id_missing_cas
  ansible.builtin.set_fact:
    missing_root_cas: >-
      {{ missing_root_cas
        + [ { 'name': item.subject.commonName, 'pem': item.item,
        'subject_line':
        'subject=C = ' ~ (item.subject.countryName | default('US'))
        ~ ', O = ' ~ (item.subject.organizationName | default('U.S. Government'))
        ~ ', OU = ' ~ (item.subject_ordered.organizationalUnitName[0] | default('DoD'))
        ~ ', OU = ' ~ (item.subject_ordered.organizationalUnitName[1] | default('PKI'))
        ~ ', CN = ' ~ item.subject.commonName,
      'issuer_line':
        'issuer=C = ' ~ (item.issuer.countryName | default('US'))
        ~ ', O = ' ~ (item.issuer.organizationName | default('U.S. Government'))
        ~ ', OU = ' ~ (item.issuer_ordered.organizationalUnitName[0] | default('DoD'))
        ~ ', OU = ' ~ (item.issuer_ordered.organizationalUnitName[1] | default('PKI'))
        ~ ', CN = ' ~ item.issuer.commonName,
          } ] }}
  loop: "{{ dod_ca_infos.results }}"
  no_log: true
  when:
    - rhel9stig_stigrule_258131_Manage
    - >
      (not item.expired | default(true)) and
      (item.subject is defined) and
      (item.subject.commonName is defined) and
      (
        sssd_db_pems
        | select('equalto', item.item)
        | list
        | length == 0
      )

- name: stigrule_258131__create_block_string
  ansible.builtin.set_fact:
    missing_root_cas_block: "{{ (missing_root_cas_block | default([]))
                                + [ item.subject_line ~ '\n\n'
                                    ~ item.issuer_line ~ '\n\n'
                                    ~ item.pem ~ '\n\n' ] }}"
  loop: "{{ missing_root_cas }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when:
    - rhel9stig_stigrule_258131_Manage
    - missing_root_cas | length > 0

- name: stigrule_258131__concatinate_missing_cas
  ansible.builtin.set_fact:
    missing_root_cas_concat: "{{ missing_root_cas_block | join('') }}"
  no_log: true
  when:
    - rhel9stig_stigrule_258131_Manage
    - missing_root_cas | length > 0

- name: stigrule_258131__update_sssd_auth_ca_db_pem
  ansible.builtin.copy:
    dest: "{{ sssd_ca_db }}"
    content: "{{ sssd_db_raw.content | b64decode }}{{ missing_root_cas_concat }}"
    mode: "0640"
    owner: root
    group: sssd
  become: true
  when:
    - rhel9stig_stigrule_258131_Manage
    # - sssd_ca_db_stat.stat.exists
    - missing_root_cas | length > 0

# R-258134 RHEL-09-651010
- name: stigrule_258134__aide_present
  ansible.builtin.package:
    name: aide
    state: present
  when:
    - rhel9stig_stigrule_258134_Manage

- name: Check for aide.conf
  ansible.builtin.stat:
    path: /etc/aide.conf
    get_checksum: false
    get_mime: false
  register: aide_conf

- name: stigrule_258134__read_aide.conf
  ansible.builtin.slurp:
    path: /etc/aide.conf
  register: aide_conf_raw
  no_log: true
  when:
    - rhel9stig_stigrule_258134_Manage

- name: stigrule_258134__Extract relevant lines from aide.conf
  ansible.builtin.set_fact:
    aide_conf_text: "{{ aide_conf_raw.content | b64decode }}"
  no_log: true
  when:
    - rhel9stig_stigrule_258134_Manage

- name: stigrule_258134__set_line_vars
  ansible.builtin.set_fact:
    aide_dbdir_line: >-
      {{ aide_conf_text
        | regex_search('^[ \\t]*@@define[ \\t]+DBDIR[ \\t]+.*$', multiline=True)
        | default('', true) }}
    aide_database_line: >-
      {{ aide_conf_text
        | regex_search('^[ \\t]*database=file:.*$', multiline=True)
        | default('', true) }}
    aide_database_out_line: >-
      {{ aide_conf_text
        | regex_search('^[ \\t]*database_out=file:.*$', multiline=True)
        | default('', true) }}
  when:
    - rhel9stig_stigrule_258134_Manage

- name: stigrule_258134__extract_vars_from_lines
  ansible.builtin.set_fact:
    aide_dbdir: >-
      {{ aide_dbdir_line
        | regex_replace('^[ \\t]*@@define[ \\t]+DBDIR[ \\t]+', '')
        | regex_replace('[ \\t#].*$', '') }}
    aide_database: >-
      {{ aide_database_line
        | regex_replace('^[ \\t]*database=file:', '')
        | regex_replace('[ \\t#].*$', '') }}
    aide_database_out: >-
      {{ aide_database_out_line
        | regex_replace('^[ \\t]*database_out=file:', '')
        | regex_replace('[ \\t#].*$', '') }}
  when:
    - rhel9stig_stigrule_258134_Manage

- name: stigrule_258134__expand_DBDIR_in_paths
  ansible.builtin.set_fact:
    aide_database_path: >-
      {{ aide_database | regex_replace('@@{DBDIR}', aide_dbdir) }}
    aide_database_out_path: >-
      {{ aide_database_out | regex_replace('@@{DBDIR}', aide_dbdir) }}
  when:
    - rhel9stig_stigrule_258134_Manage

- name: stigrule_258134__stat_db_file
  ansible.builtin.stat:
    path: "{{ aide_database_path }}"
    get_checksum: false
    get_mime: false
  register: aide_db_stat
  when:
    - rhel9stig_stigrule_258134_Manage

- name: stigrule_258134__aide_check
  ansible.builtin.command: /usr/sbin/aide --check
  register: aide_check_output
  failed_when: aide_check_output.rc not in [0,1,2,3,4,5,6,7]
  async: 1800
  poll: 30
  changed_when: false
  no_log: true
  when:
    - rhel9stig_stigrule_258134_Manage
    - aide_db_stat.stat.exists

- name: stigrule_258134__aide_initialize
  ansible.builtin.command: /usr/sbin/aide --init
  async: 1800
  poll: 30
  register: aide_out
  changed_when: "'AIDE initialized database' in aide_out.stdout"
  when:
    - rhel9stig_stigrule_258134_Manage
    - >
      (aide_db_stat.stat.exists and (aide_check_output.stderr | length > 0))
      or (not aide_db_stat.stat.exists)

- name: stigrule_258134__rename_AIDE_db
  ansible.builtin.command: mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
  changed_when: aide_move.rc == 0
  register: aide_move
  when:
    - rhel9stig_stigrule_258134_Manage
    - aide_out.changed

# R-258135 RHEL-09-651015
- name: stigrule_258135__ensure_aide_present
  ansible.builtin.dnf:
    name: aide
    state: present
  when: rhel9stig_stigrule_258135_Manage

- name: stigrule_258135__ensure_mailx_present
  ansible.builtin.dnf:
    name: mailx
    state: present
  when: rhel9stig_stigrule_258135_Manage

- name: stigrule_258135__stat_cron_dirs_and_files
  ansible.builtin.shell: |
    set -o pipefail
    find /etc/crontab /etc/cron.d /etc/cron.daily /etc/cron.hourly /etc/cron.weekly /etc/cron.monthly /var/spool/cron -type f -exec grep 'aide' {} \; || true
  register: aide_cron_files
  changed_when: false
  when: rhel9stig_stigrule_258135_Manage

- name: stigrule_258135__create_aide_cronjob
  ansible.builtin.cron:
    name: aide
    cron_file: /etc/cron.{{ rhel9stig_stigrule_258135_frequency }}/aide
    minute: 0
    hour: 5
    day: "*"
    weekday: "*"
    month: "*"
    user: root
    job: /usr/sbin/aide  --check | /bin/mail -s "$(hostname) - AIDE {{ rhel9stig_stigrule_258135_frequency }} Integrity Check" {{ rhel9stig_stigrule_258135_notify_email }}
  when:
    - rhel9stig_stigrule_258135_Manage
    - aide_cron_files.stdout | length == 0

- name: Check aide rule attributes
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      lines=$(grep -E '^[A-Za-z][A-Za-z0-9_]*[[:space:]]*=[[:space:]]*[A-Za-z0-9_]+(\+[A-Za-z0-9_]+)+[[:space:]]*$' /etc/aide.conf || true)
      printf 'sha512=%s\n' "$(printf '%s\n' "$lines" | grep -vcE '(^|\+)sha512(\+|[[:space:]]*$)' || true)"
      printf 'acl=%s\n' "$(printf '%s\n' "$lines" | grep -vcE '(^|\+)acl(\+|[[:space:]]*$)' || true)"
      printf 'xattrs=%s\n' "$(printf '%s\n' "$lines" | grep -vcE '(^|\+)xattrs(\+|[[:space:]]*$)' || true)"
  register: aide_attr_check
  changed_when: false
  when:
    - aide_conf.stat.exists | default(false)

- name: Parse aide attributes
  ansible.builtin.set_fact:
    aide_missing_sha512: "{{ aide_attr_check.stdout_lines[0].split('=')[1] }}"
    aide_missing_acl: "{{ aide_attr_check.stdout_lines[1].split('=')[1] }}"
    aide_missing_xattrs: "{{ aide_attr_check.stdout_lines[2].split('=')[1] }}"
  when: aide_attr_check is not skipped

# V-258136 RHEL-09-651020
- name: stigrule_258136__ensure_aide_sha512
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      sed -i -E '/^[[:space:]]*#/! {
        /^[A-Za-z][A-Za-z0-9_]*[[:space:]]*=[[:space:]]*[A-Za-z0-9_]+(\+[A-Za-z0-9_]+)+[[:space:]]*$/ {
          /(^|\+)sha512(\+|[[:space:]]*$)/! s/[[:space:]]*$/+sha512/
        }
      }' /etc/aide.conf
  when:
    - rhel9stig_stigrule_258136_Manage
    - aide_conf.stat.exists | default(false)
    - aide_missing_sha512 | default('0') | int > 0
  register: aide_sha512
  changed_when: aide_sha512.rc == 0
  notify: restart_aide

# R-258137 RHEL-09-651025
- name: stigrule_258137__protect_audit_tools_with_aide
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^{{ item | regex_escape }}[[:space:]]'
    line: "{{ item }} {{ rhel9stig_stigrule_258137_audit_tool_rule }}"
    owner: root
    group: root
    mode: '0640'
  loop: "{{ rhel9stig_stigrule_audit_tool_bins }}"
  notify: restart_aide
  when:
    - rhel9stig_stigrule_258137_Manage
    - aide_conf.stat.exists | default(false)

# V-258138 RHEL-09-651030
