# ---------------------------------------------------------------------------
# R-258230 RHEL-09-671010 - FIPS mode is applied early on purpose.
# "fips-mode-setup --enable" does not only set the kernel flag: it also sets the
# systemwide crypto policy to plain "FIPS". Running it after R-258241
# (RHEL-09-215105) would reset /etc/crypto-policies/config from "FIPS:STIG" back
# to "FIPS", so "update-crypto-policies --show" would report "FIPS" and 258241
# would be a finding. The STIG.pmod file itself is never touched, so only the
# subpolicy *selection* is lost, but enabling FIPS first avoids having to reapply.
# ---------------------------------------------------------------------------

# R-258230 RHEL-09-671010
- name: stigrule_258230__enable_fips_mode
  ansible.builtin.command: fips-mode-setup --enable
  register: fips_mode_setup
  changed_when: fips_mode_setup.rc == 0
  notify: reboot
  when:
    - rhel9stig_stigrule_258230_Manage
    - not fips_enabled

- name: Run pending handlers
  ansible.builtin.meta: flush_handlers

- name: stigrule_258230__report_fips_requires_reinstall
  ansible.builtin.debug:
    msg: >-
      FIPS mode is still not active. Per RHEL-09-671010, if enabling FIPS on an
      already installed system fails, this is a permanent finding until the system
      is reinstalled with "fips=1" supplied during installation.
  when:
    - rhel9stig_stigrule_258230_Manage
    - not fips_enabled
    - not rhel9stig_allow_system_reboot

# ---------------------------------------------------------------------------
# R-258241 RHEL-09-215105 - Cryptographic subpolicy is applied early on purpose.
# When "update-crypto-policies"  is set, it needs to be done with its
# cryptographic subpolicy. Without the subpolicy in place, FIPS 140-3-compliant
# algorithms may not be present when "update-crypto-policies" is executed.
# ---------------------------------------------------------------------------

# R-258241 RHEL-09-215105
- name: Get current system-wide cryptographic policy
  ansible.builtin.command:
    cmd: update-crypto-policies --show
  changed_when: false
  register: current_crypto_policy

- name: stigrule_258241__create_stig_crypto_subpolicy
  ansible.builtin.copy:
    dest: /etc/crypto-policies/policies/modules/STIG.pmod
    content: |
      # Define ciphers and MACs for OpenSSH and libssh
      cipher@SSH = {{ rhel9stig_stigrule_258241_ssh_ciphers | join(' ') }}
      mac@SSH = {{ rhel9stig_stigrule_258241_ssh_macs | join(' ') }}
      min_rsa_size = {{ rhel9stig_stigrule_258241_min_rsa_size }}
    owner: root
    group: root
    mode: '0644'
  register: stig_pmod
  when: rhel9stig_stigrule_258241_Manage

- name: stigrule_258241__set_fips_stig_crypto_policy
  ansible.builtin.command: "update-crypto-policies --set {{ rhel9stig_stigrule_crypto_policy }}"
  register: set_crypto_policy
  changed_when: set_crypto_policy.rc == 0
  notify: reboot
  when:
    - rhel9stig_stigrule_258241_Manage
    - >
      stig_pmod.changed or
      current_crypto_policy.stdout != rhel9stig_stigrule_crypto_policy

# R-257989 RHEL-09-255065
- name: Check opensshserver.config for Ciphers
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      sed -nE 's/^[[:space:]]*Ciphers[[:space:]]+//Ip' /etc/crypto-policies/back-ends/opensshserver.config || true
    executable: /bin/bash
  register: opensshserver_ciphers_check
  changed_when: false
  when:
    - rhel9stig_stigrule_257989_Manage

- name: stigrule_257989__reinstall_crypto_policies
  ansible.builtin.command: dnf -y reinstall crypto-policies
  register: crypto_policies_ciphers_reinstall
  changed_when: "'Nothing to do' not in crypto_policies_ciphers_reinstall.stdout"
  when:
    - rhel9stig_stigrule_257989_Manage
    - opensshserver_ciphers_check.stdout != (rhel9stig_stigrule_257989_approved_ciphers | join(","))

- name: stigrule_257989__update_opensshserver_approved_ciphers
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: "^(Ciphers[[:space:]]+).*"
    replace: '\1{{ rhel9stig_stigrule_257989_approved_ciphers | join(",") }}'
  loop:
    - /usr/share/crypto-policies/FIPS/opensshserver.txt
    - /usr/share/crypto-policies/back-ends/FIPS/opensshserver.config
    - /etc/crypto-policies/back-ends/opensshserver.config
  register: usr_share_update_ciphers
  when: rhel9stig_stigrule_257989_Manage

- name: stigrule_257989__set_fips_stig_crypto_policy
  ansible.builtin.command: "update-crypto-policies --set {{ rhel9stig_stigrule_crypto_policy }}"
  register: set_crypto_policy
  changed_when: set_crypto_policy.rc == 0
  notify: reboot
  when:
    - rhel9stig_stigrule_257989_Manage
    - >
      crypto_policies_ciphers_reinstall.changed or
      usr_share_update_ciphers.changed

- name: Run pending handlers
  ansible.builtin.meta: flush_handlers

# R-257991 RHEL-09-255075
- name: Check opensshserver.config for MACs
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      sed -nE 's/^[[:space:]]*MACs[[:space:]]+//Ip' /etc/crypto-policies/back-ends/opensshserver.config || true
    executable: /bin/bash
  register: opensshserver_macs_check
  changed_when: false
  when:
