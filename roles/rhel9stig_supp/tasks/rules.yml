- name: Get detailed default zone info
  ansible.posix.firewalld_info:
    zones: "{{ default_zone }}"
  register: zone_details
  when:
    - rhel9stig_stigrule_257937_Manage

- name: Get built-in zone names
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      find /usr/lib/firewalld/zones -maxdepth 1 -type f -name '*.xml' -printf '%f\n' | sed 's/\.xml$//' || true
  register: builtin_zones
  changed_when: false
  when:
