# R-258143 RHEL-09-652025
- name: Find rsyslog remote log reception directives
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep -rlE '{{ rhel9stig_stigrule_258143_input_directives | join("|") }}' /etc/rsyslog.conf /etc/rsyslog.d/ 2>/dev/null || true
  register: rsyslog_inputs
  changed_when: false
  when:
    - rhel9stig_stigrule_258143_Manage
    - not rhel9stig_stigrule_258143_is_log_aggregator

- name: stigrule_258143__disable_rsyslog_remote_log_reception
  ansible.builtin.replace:
    path: "{{ item.0 }}"
    regexp: '^([^#\n]*{{ item.1 }}.*)$'
    replace: '# \1'
  loop: "{{ (rsyslog_inputs.stdout_lines | default([])) | product(rhel9stig_stigrule_258143_input_directives) | list }}"
  loop_control:
    label: "{{ item.0 }} :: {{ item.1 }}"
  notify: restart_rsyslog
  when:
    - rhel9stig_stigrule_258143_Manage
    - not rhel9stig_stigrule_258143_is_log_aggregator
    - rsyslog_inputs.stdout_lines | default([]) | length > 0

# R-258149 RHEL-09-652055
- name: stigrule_258149__forward_audit_records_via_tcp
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/stig-remote-forward.conf
    content: |
      action(
        type="omfwd"
        target="{{ rhel9stig_stigrule_258149_remote_server }}"
        port="{{ rhel9stig_stigrule_258149_remote_port }}"
        protocol="tcp"
        action.resumeRetryCount="{{ rhel9stig_stigrule_258149_retry_count }}"
        queue.type="LinkedList"
        queue.size="{{ rhel9stig_stigrule_258149_queue_size }}"
      )
    owner: root
    group: root
    mode: '0644'
  notify: restart_rsyslog
  when:
    - rhel9stig_stigrule_258149_Manage
    - rhel9stig_stigrule_258149_remote_server | length > 0

- name: stigrule_258149__report_no_remote_log_server
  ansible.builtin.debug:
    msg: >-
      rhel9stig_stigrule_258149_remote_server is empty, so no audit record
      forwarding was configured. RHEL-09-652055 requires audit records to be
      off-loaded via TCP to a log aggregation server.
  when:
    - rhel9stig_stigrule_258149_Manage
    - rhel9stig_stigrule_258149_remote_server | length == 0

- name: Run pending handlers
  ansible.builtin.meta: flush_handlers

# R-258155 RHEL-09-653030
- name: Get the audit log partition size
  ansible.builtin.set_fact:
    audit_partition: >-
      {{
        (ansible_facts.mounts
          | selectattr('mount', 'in', ['/var/log/audit', '/var/log', '/var', '/'])
          | sort(attribute='mount', reverse=true)
          | first) | default({}, true)
      }}
  when: rhel9stig_stigrule_258155_Manage

- name: stigrule_258155__report_insufficient_audit_storage
  ansible.builtin.debug:
    msg: >-
      The partition holding the audit logs ({{ audit_partition.mount | default('unknown') }})
      has {{ (audit_partition.size_total | default(0) / 1073741824) | round(2) }} GiB total,
      which is below the configured minimum of
      {{ rhel9stig_stigrule_258155_min_size_gb }} GiB for one week of audit records.
      The partition must be resized or a dedicated audit partition created.
  when:
    - rhel9stig_stigrule_258155_Manage
    - audit_partition.size_total is defined
    - (audit_partition.size_total | int) < (rhel9stig_stigrule_258155_min_size_gb | int * 1073741824)

- name: Read auditd log location and group
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      awk -F= '/^[[:space:]]*{{ item }}[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); print $2}' /etc/audit/auditd.conf || true
  loop:
    - log_file
    - log_group
  register: auditd_settings
  changed_when: false

- name: Set audit log facts
  ansible.builtin.set_fact:
    audit_log_file: "{{ auditd_settings.results[0].stdout | default('') | default('/var/log/audit/audit.log', true) }}"
    audit_log_group: "{{ auditd_settings.results[1].stdout | default('') | default('root', true) }}"
  when: auditd_settings.results is defined

- name: Set audit log directory fact
  ansible.builtin.set_fact:
    audit_log_dir: "{{ audit_log_file | dirname }}"
  when: audit_log_file is defined

- name: Find audit log files
  ansible.builtin.find:
    paths: "{{ audit_log_dir }}"
    patterns: '*'
    file_type: file
  register: audit_log_files
  when:
    - audit_log_dir is defined

# R-258165 RHEL-09-653080
