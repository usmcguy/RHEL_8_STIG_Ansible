# R-258028 RHEL-09-271090
- name: Check modification time of dconf databases
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      function dconf_needs_update {
        for db in $(find /etc/dconf/db -maxdepth 1 -type f);
          do db_mtime=$(stat -c %Y "$db");
          if [ -d "$db".d/ ];
            then keyfile_mtime=$(stat -c %Y "$db".d/* | sort -n | tail -1);
            if [ -n "$db_mtime" ] && [ -n "$keyfile_mtime" ] && [ "$db_mtime" -lt "$keyfile_mtime" ];
              then echo "$db needs update";
              return 1;
            fi;
          fi;
        done;
      };
      dconf_needs_update || true
  notify: dconf_update
  changed_when: false
  when:
    - rhel9stig_stigrule_258028_Manage
    - gui_installed

