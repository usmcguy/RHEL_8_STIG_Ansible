# R-258106 RHEL-09-611085
- name: Find sudoers files containing NOPASSWD
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep -rlE '^[^#]*NOPASSWD' /etc/sudoers /etc/sudoers.d/ 2>/dev/null || true
  register: sudoers_nopasswd
  changed_when: false
  when: rhel9stig_stigrule_258106_Manage

- name: Create regex filter for exempt users
  ansible.builtin.set_fact:
    exempt_sudoers: "{{ rhel9stig_stigrule_258106_exempt_users | map('regex_escape') | list | join('|') }}"
  when:
