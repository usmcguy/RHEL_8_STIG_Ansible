# R-258120 RHEL-09-611155
- name: Find accounts with blank_passwords
  ansible.builtin.shell: |
    set -o pipefail
    awk -F: '!$2 {print $1}' /etc/shadow | while read user; do
      {% if rhel9stig_stigrule_258120_IgnoreSvcAccts %}
      uid=$(id -u "$user" 2>/dev/null)
      if [ $? -eq 0 ] && [ "$uid" -ge {{ uid_min }} ]; then
        echo "$user"
      fi
      {% else %}
      echo "$user"
      {% endif %}
    done
  register: blank_password_accounts
  changed_when: false
  when: rhel9stig_stigrule_258120_Manage

- name: stigrule_258120__lock_accounts_with_blank_passwords
  ansible.builtin.user:
    name: "{{ item }}"
    password_lock: true
  loop: "{{ blank_password_accounts.stdout_lines | default([]) }}"
  when:
    - rhel9stig_stigrule_258120_Manage
    - blank_password_accounts.stdout_lines | default([]) | length > 0

