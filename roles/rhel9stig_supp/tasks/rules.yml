- name: stigrule_257937__create_firewall_zone
  ansible.posix.firewalld:
    zone: "{{ rhel9stig_stigrule_257937_zone }}"
    state: present
    permanent: true
  register: create_firewall_zone
  when:
    - rhel9stig_stigrule_257937_Manage
    - rhel9stig_stigrule_257937_zone not in builtin_zones

- name: stigrule_257937__set_zone_shortname
  ansible.builtin.lineinfile:
    path: /etc/firewalld/zones/{{ rhel9stig_stigrule_257937_zone }}.xml
    regexp: '^(\s*)<short>.*</short>'
    line: "  <short>{{ rhel9stig_stigrule_257937_zone }}</short>"
    insertafter: '<zone'
    state: present
  register: firewall_zone_shortname
  when:
    - rhel9stig_stigrule_257937_Manage
    - rhel9stig_stigrule_257937_zone not in builtin_zones

- name: stigrule_257937__set_zone_description
  ansible.builtin.lineinfile:
